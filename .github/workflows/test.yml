name: Tests
on:
  push:
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the 3D bundles match their sources
        run: |
          npm run build
          git diff --exit-code -- shared/sq-three.js home/table-three.js
      - run: npx playwright install --with-deps chromium
      - run: npm test
