name: Tests
on:
  push:
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check generated files match their sources (content JSON, 3D bundles)
        run: |
          npm run build
          git diff --exit-code -- content/content.js shared/sq-three.js home/table-three.js
      - name: Audio report (missing recordings are listed, broken links fail)
        run: npm run audio
      - run: npx playwright install --with-deps chromium
      - run: npm test
